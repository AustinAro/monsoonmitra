name: Daily Monsoon Risk Forecast Update

on:
  schedule:
    # Run once daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Enable manual triggers from GitHub interface

permissions:
  contents: write # Required for committing changes back to the repository

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run risk assessment script
        run: python monsoonmitra.py

      - name: Commit and push if results.json changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results.json
          # Check if there are staged changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "data: daily monsoon risk assessment updates [skip ci]"
            git push
          else
            echo "No changes to weather forecast results.json."
          fi
